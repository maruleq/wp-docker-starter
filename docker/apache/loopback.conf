# Make Apache listen on WP_PORT as well, the same port the host publishes.
#
# Why: the site URL is http://localhost:${WP_PORT}, but the docker compose port
# mapping only exists on the host. Inside the container Apache listens on port 80,
# so without this file every WordPress loopback request is refused: WP-Cron never
# runs its jobs, Site Health reports two critical errors, the REST API cannot
# preload data in the block editor, and the theme file editor cannot verify a save.
#
# Note: with WP_PORT=80 loopback already works and this file causes an
# "Address already in use" failure. Comment out its mount in docker-compose.yml.
Listen ${WP_PORT}

<VirtualHost *:${WP_PORT}>
	DocumentRoot /var/www/html
	<Directory /var/www/html>
		Options FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>
</VirtualHost>
