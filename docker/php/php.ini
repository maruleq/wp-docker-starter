[PHP]
; ─── Memory ─────────────────────────────────────────────────────────────────────
memory_limit          = 256M

; ─── File upload ─────────────────────────────────────────────────────────────────
upload_max_filesize   = 64M
post_max_size         = 64M

; ─── Time limits ─────────────────────────────────────────────────────────────────
max_execution_time    = 120
max_input_time        = 120

; ─── Input variables ─────────────────────────────────────────────────────────────
max_input_vars        = 3000

; ─── Timezone ────────────────────────────────────────────────────────────────────
date.timezone         = Europe/Warsaw

; ─── Sendmail → msmtp (Mailpit) ──────────────────────────────────────────────
sendmail_path         = "/usr/bin/msmtp -t -f wordpress@wp.local"

; ─── Error display (development environment) ────────────────────────────────────
display_errors        = On
log_errors            = On
error_log             = /tmp/php_errors.log
error_reporting       = E_ALL

; ─── OPcache ─────────────────────────────────────────────────────────────────
[opcache]
opcache.enable                 = 1
opcache.memory_consumption     = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files  = 4000
; Development: check file changes on every request
opcache.revalidate_freq        = 0
opcache.validate_timestamps    = 1

; ─── Xdebug ──────────────────────────────────────────────────────────────────
; To enable debugging, change mode to: debug
; VS Code port: 9003 (default for Xdebug 3)
[xdebug]
xdebug.mode               = off
; Xdebug activates only when the request contains XDEBUG_TRIGGER (cookie/header/querystring)
; This way it does not slow down every request by default.
xdebug.start_with_request = trigger
xdebug.client_host        = host.docker.internal
xdebug.client_port        = 9003
xdebug.idekey             = VSCODE
xdebug.log                = /tmp/xdebug.log
