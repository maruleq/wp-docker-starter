[PHP]
; ─── Memory ─────────────────────────────────────────────────────────────────────
memory_limit          = 256M

; ─── File upload ─────────────────────────────────────────────────────────────────
upload_max_filesize   = 64M
post_max_size         = 64M

; ─── Time limits ─────────────────────────────────────────────────────────────────
max_execution_time    = 120
max_input_time        = 120

; ─── Input variables ─────────────────────────────────────────────────────────────
max_input_vars        = 3000

; ─── Timezone ────────────────────────────────────────────────────────────────────
date.timezone         = Europe/Warsaw

; ─── Sendmail → msmtp (Mailpit) ──────────────────────────────────────────────
sendmail_path         = "/usr/bin/msmtp -t -f wordpress@wp.local"

; ─── Error display (development environment) ────────────────────────────────────
; display_errors is deliberately Off. A PHP message printed before <!DOCTYPE>
; puts the browser into quirks mode and breaks the page layout, and older themes
; and plugins emit plenty of warnings on PHP 8.4. Errors go to stderr instead, so
; they show up in `docker compose logs wordpress`. Set it to On when you are
; working on your own, clean code.
display_errors        = Off
display_startup_errors = Off
log_errors            = On
error_log             = /dev/stderr
; E_DEPRECATED excluded: older plugins can emit thousands of these per request,
; which makes the log unreadable. Add it back when hunting compatibility issues.
error_reporting       = E_ALL & ~E_DEPRECATED

; ─── OPcache ─────────────────────────────────────────────────────────────────
[opcache]
opcache.enable                 = 1
; The default 4000-file limit is too low for a real project: WooCommerce or
; WPBakery alone are several thousand PHP files each, and anything above the limit
; is recompiled on every request. The 8 MB interned strings buffer fills up
; completely, which costs memory and CPU on every request.
opcache.memory_consumption     = 192
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files  = 20000
; Development: check file changes on every request
opcache.revalidate_freq        = 0
opcache.validate_timestamps    = 1

; ─── Xdebug ──────────────────────────────────────────────────────────────────
; To enable debugging, change mode to: debug
; VS Code port: 9003 (default for Xdebug 3)
[xdebug]
xdebug.mode               = off
; Xdebug activates only when the request contains XDEBUG_TRIGGER (cookie/header/querystring)
; This way it does not slow down every request by default.
xdebug.start_with_request = trigger
xdebug.client_host        = host.docker.internal
xdebug.client_port        = 9003
xdebug.idekey             = VSCODE
xdebug.log                = /tmp/xdebug.log
